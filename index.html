<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>076 lofi</title>
<meta name="description" content="Generative lo-fi, composed in your browser.">
<meta name="theme-color" content="#141110">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* The palette sets --hue and --chroma at runtime; everything is derived
     from them, so the whole page moves together when the track changes. */
  :root {
    --hue: 40;
    --chroma: 0.05;
    --mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    /* A colour change should feel like light shifting in a room, not a
       theme being switched. */
    --shift: 2.4s var(--ease);
  }

  /* Night, and the default: this is a thing to leave running in the dark. */
  :root, :root[data-mode="night"] {
    --bg: oklch(0.145 calc(var(--chroma) * 0.55) var(--hue));
    --bg-far: oklch(0.10 calc(var(--chroma) * 0.4) var(--hue));
    --panel: oklch(0.21 calc(var(--chroma) * 0.5) var(--hue) / 0.55);
    --line: oklch(0.34 calc(var(--chroma) * 0.45) var(--hue) / 0.5);
    --text: oklch(0.96 0.012 var(--hue));
    --dim: oklch(0.74 0.022 var(--hue));
    --faint: oklch(0.55 0.02 var(--hue));
    --accent: oklch(0.82 calc(var(--chroma) + 0.06) var(--hue));
    --accent-soft: oklch(0.82 calc(var(--chroma) + 0.06) var(--hue) / 0.15);
    --glow: oklch(0.7 calc(var(--chroma) + 0.05) var(--hue) / 0.30);
  }

  :root[data-mode="day"] {
    --bg: oklch(0.955 calc(var(--chroma) * 0.30) var(--hue));
    --bg-far: oklch(0.90 calc(var(--chroma) * 0.42) var(--hue));
    --panel: oklch(1 0 0 / 0.5);
    --line: oklch(0.55 calc(var(--chroma) * 0.35) var(--hue) / 0.32);
    --text: oklch(0.24 0.03 var(--hue));
    --dim: oklch(0.44 0.035 var(--hue));
    --faint: oklch(0.60 0.03 var(--hue));
    --accent: oklch(0.50 calc(var(--chroma) + 0.05) var(--hue));
    --accent-soft: oklch(0.50 calc(var(--chroma) + 0.05) var(--hue) / 0.12);
    --glow: oklch(0.72 calc(var(--chroma) + 0.04) var(--hue) / 0.34);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(22px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    transition: background var(--shift), color var(--shift);
    overflow-x: hidden;
  }

  /* Two soft pools of light behind everything. They drift very slowly —
     slow enough that you notice only that the room is not static. */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: -30vmax;
    z-index: -1;
    background: radial-gradient(38vmax 38vmax at 30% 28%, var(--glow), transparent 68%);
    transition: background var(--shift);
    animation: drift 54s var(--ease) infinite alternate;
    pointer-events: none;
  }

  body::after {
    background: radial-gradient(44vmax 44vmax at 72% 74%, var(--glow), transparent 70%);
    animation-duration: 78s;
    animation-direction: alternate-reverse;
    opacity: 0.7;
  }

  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to   { transform: translate3d(4%, 3%, 0) scale(1.12); }
  }

  /* Deeper at the edges, so the page reads as a space rather than a card. */
  /* The music, drawn from its own score. It sits behind the content as
     part of the room's light rather than as a panel of bars. */
  #scope {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1.2s var(--ease);
    pointer-events: none;
  }

  #scope[data-on="true"] { opacity: 1; }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(120% 90% at 50% 40%, transparent 42%, var(--bg-far) 100%);
    transition: background var(--shift);
    pointer-events: none;
  }

  .stage {
    width: min(100%, 520px);
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--accent);
    transition: color var(--shift);
  }

  .mode {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }

  .mode:hover { color: var(--accent); border-color: var(--accent); }
  .mode svg { display: block; }
  :root[data-mode="day"] .mode .moon { display: none; }
  :root:not([data-mode="day"]) .mode .sun { display: none; }

  /* --- the hero: what you are listening to --------------------------- */

  .now {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 78px;
    justify-content: center;
  }

  .now-name {
    font-size: clamp(28px, 8vw, 40px);
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1.05;
    color: var(--text);
    transition: color var(--shift);
  }

  .now-name[data-idle="true"] { color: var(--faint); font-weight: 500; }

  .now-sub {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--faint);
    min-height: 15px;
  }

  /* --- transport ------------------------------------------------------ */

  .transport {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .play {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.18s var(--ease), background 0.2s, box-shadow 0.3s, color var(--shift), border-color var(--shift);
  }

  .play:hover { transform: scale(1.045); box-shadow: 0 0 0 10px var(--accent-soft); }
  .play:active { transform: scale(0.98); }
  .play:disabled { opacity: 0.5; cursor: progress; }
  .play svg { display: block; margin-left: 3px; }
  .play[aria-pressed="true"] svg { margin-left: 0; }

  /* A slow pulse while it is writing the first bars, so the wait reads as
     work happening rather than as nothing happening. */
  .play[data-busy="true"] { animation: breathe 2.1s var(--ease) infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
    50% { box-shadow: 0 0 0 14px transparent; }
  }

  .vol {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(100%, 240px);
    color: var(--faint);
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 2px;
    border-radius: 999px;
    background: var(--line);
    outline: none;
    cursor: pointer;
    transition: background var(--shift);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
    transition: background var(--shift);
  }

  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
  }

  /* --- three words ----------------------------------------------------- */

  .words-block { display: flex; flex-direction: column; gap: 11px; }

  .words {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .words input {
    width: 100%;
    padding: 13px 12px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    transition: border-color 0.2s, background var(--shift), color var(--shift);
  }

  .words input::placeholder { color: var(--faint); opacity: 0.75; }
  .words input:focus { border-color: var(--accent); outline: none; }

  .reading {
    margin: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--faint);
    min-height: 15px;
  }

  .status {
    margin: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--dim);
    min-height: 17px;
    transition: color var(--shift);
  }

  .status[data-tone="error"] { color: oklch(0.7 0.17 28); }

  /* --- what is happening, kept quiet ----------------------------------- */

  .readout {
    margin: 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px 18px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
  }

  .readout div { display: flex; gap: 7px; align-items: baseline; }
  .readout dt { letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; }
  .readout dd { margin: 0; color: var(--dim); font-variant-numeric: tabular-nums; }
  .readout dd.progression, .readout dd.palette { color: var(--accent); transition: color var(--shift); }

  .footnote {
    margin: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.85;
    color: var(--faint);
    opacity: 0.8;
  }

  .footnote a { color: inherit; text-decoration-color: var(--line); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; }
    .play, .play:hover { transition: none; transform: none; animation: none; }
    :root { --shift: 0.01s; }
  }
</style>
</head>
<body>
<canvas id="scope" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="stage">
  <div class="masthead">
    <span class="brand">076 lofi</span>
    <button class="mode" id="mode" aria-label="Switch between day and night">
      <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="now">
    <div class="now-name" id="palette" data-idle="true">three words, then play</div>
    <div class="now-sub" id="feel"></div>
  </div>

  <div class="transport">
    <button class="play" id="play" aria-label="Play" aria-pressed="false">
      <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l12-7z" fill="currentColor"></path></svg>
    </button>
    <div class="vol">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 4V4L6 8H3z" fill="currentColor"></path><path d="M13.5 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.5" fill="none"></path></svg>
      <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>

  <div class="words-block">
    <div class="words">
      <input id="w1" maxlength="18" placeholder="rain" aria-label="First word" autocomplete="off" spellcheck="false" enterkeyhint="done">
      <input id="w2" maxlength="18" placeholder="neon" aria-label="Second word" autocomplete="off" spellcheck="false" enterkeyhint="done">
      <input id="w3" maxlength="18" placeholder="midnight" aria-label="Third word" autocomplete="off" spellcheck="false" enterkeyhint="done">
    </div>
    <p class="reading" id="reading"></p>
  </div>

  <p class="status" id="status">press play &mdash; a few bars are written, then it plays while writing more</p>

  <dl class="readout">
    <div><dt>key</dt><dd id="key">&mdash;</dd></div>
    <div><dt>chord</dt><dd class="progression" id="progression">&mdash;</dd></div>
    <div><dt>section</dt><dd id="section">&mdash;</dd></div>
  </dl>

  <p class="footnote">
    composed on this device, note by note &mdash; nothing is sampled<br>
    <a href="live.html">live engine &rarr;</a>
  </p>
</div>

<script src="vendor/tone.js"></script>
<script type="module">
import { LofiStream } from './js/stream.js';
import { chordLabel, romanLabel } from './js/theory.js';

const params = new URLSearchParams(location.search);
const wordInputs = ['w1', 'w2', 'w3'].map((id) => document.getElementById(id));
const currentWords = () => wordInputs.map((el) => el.value.trim()).filter(Boolean);

const stream = new LofiStream({
  bypass: (params.get('bypass') || '').split(',').filter(Boolean),
  barsPerChunk: params.get('bars'),
  // ?texture=1 to hear the lo-fi layer; off until its levels are settled.
  texture: params.get('texture'),
  words: (params.get('words') || '').split(/[ ,]+/).filter(Boolean),
});
window.__stream = stream;

const $ = (id) => document.getElementById(id);
const playBtn = $('play'), playIcon = $('play-icon'), volume = $('volume');

const PLAY = 'M8 5v14l12-7z';
const STOP = 'M7 7h10v10H7z';

function setStatus(text, tone) {
  $('status').textContent = text;
  if (tone) $('status').dataset.tone = tone; else delete $('status').dataset.tone;
}

function setPlayingUI(on) {
  playIcon.querySelector('path').setAttribute('d', on ? STOP : PLAY);
  playBtn.setAttribute('aria-label', on ? 'Stop' : 'Play');
  playBtn.setAttribute('aria-pressed', String(on));
  if (!on) playBtn.dataset.busy = 'false';
}

stream.onStatus = (text) => setStatus(text);

stream.onChunk = (chunk) => {
  const first = chunk.plans[0];
  const palette = chunk.palette;
  if (palette) {
    $('palette').textContent = palette.name;
    $('palette').dataset.idle = 'false';
    $('feel').textContent = palette.mode + ' · ' + Math.round(chunk.bpm) + ' bpm · ' + palette.blurb.split(', ').pop();
    // The page takes its colour from what is playing. Everything visual is
    // derived from these two values, so the whole room changes together.
    applyColour(palette);
  }
  $('key').textContent = first.key;
  $('progression').textContent = first.chord ? chordLabel(first.chord, first.key) : '—';
  $('section').textContent = first.section.name;
  setStatus('playing — written on this device, a minute at a time');
  // Lock-screen controls: this is a real media element, so the platform
  // offers them, and they should do what they say.
  if ('mediaSession' in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: (palette ? palette.name : first.key) + ' · ' + first.section.name,
      artist: '076 lofi',
      album: 'generated on this device',
    });
    navigator.mediaSession.playbackState = 'playing';
    for (const [action, handler] of [['play', () => start()], ['pause', () => stop()], ['stop', () => stop()]]) {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) { /* unsupported */ }
    }
  }
};

// Say what the words were understood as, including when a word was only
// half understood — silently treating "blorf" as neutral would look like
// the words did nothing.
function showReading(reading) {
  const el = $('reading');
  if (!reading) { el.textContent = ''; return; }
  const s = reading.sense;
  const lean = (v, low, high) => (Math.abs(v) < 0.15 ? null : v > 0 ? high : low);
  const traits = [
    lean(s.warmth, 'dark', 'bright'),
    lean(s.energy, 'still', 'restless'),
    lean(s.space, 'close', 'spacious'),
    // Not 'bright' at this end: warmth already uses that word, and the two
    // axes collided into "bright · bright" whenever both leaned high.
    lean(s.melancholy, 'easy', 'wistful'),
  ].filter(Boolean);
  const guessed = reading.words.filter((w) => w.how !== 'known');
  el.textContent = (traits.length ? traits.join(' · ') : 'even')
    + (guessed.length ? '   (' + guessed.map((w) => w.word + ' → ' + w.how).join(', ') + ')' : '');
}

// Words set before playing decide the piece. Changing them while it plays
// would mean the music you hear was written for the old ones, so they take
// effect on the next press of play.
let wordsAtStart = '';
for (const input of wordInputs) {
  input.addEventListener('input', () => {
    showReading(stream.setWords(currentWords()));
    previewPalette();
    if (stream.isPlaying && currentWords().join(' ') !== wordsAtStart) {
      setStatus('new words — press play again to write from them');
    }
  });
}
if (params.get('words')) {
  wordInputs.forEach((el, i) => { el.value = (params.get('words').split(/[ ,]+/)[i] || ''); });
}

// --- the music, drawn ---------------------------------------------------
//
// From the score rather than from the signal. Reading the signal would mean
// putting the <audio> element through createMediaElementSource, which moves
// its output into an AudioContext — and an AudioContext is suspended when
// the tab is backgrounded, so that would trade screen-off playback for a
// picture. The renderer already knows every note and its exact time, and
// the element's own clock says where we are, which is better information
// than an FFT anyway: it knows a kick from a chord.
//
// This is also only safe because the audio is pre-rendered. On the live
// engine a busy main thread starved the note scheduler and was heard as
// crackling; here there is no scheduler to starve — the element plays on
// regardless of what the page is doing.

const scope = $('scope');
const sctx = scope.getContext('2d');
let scopeRunning = false;
let scopeSize = { w: 0, h: 0 };
let scopeColour = '#e3a24d';

// Reading --accent directly gives back the unresolved declaration, calc()
// and all, which canvas cannot parse. Reading `color` off an element that
// uses it gives a resolved value.
function refreshScopeColour() {
  const probe = document.querySelector('.brand');
  if (!probe) return;
  const resolved = getComputedStyle(probe).color;
  if (resolved) scopeColour = resolved;
}
refreshScopeColour();

// Capped at 1: this is soft light, and a phone reporting 2.3 would be
// filling five times the pixels for no visible gain.
function sizeScope() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1);
  scopeSize = { w: window.innerWidth, h: window.innerHeight };
  scope.width = Math.round(scopeSize.w * dpr);
  scope.height = Math.round(scopeSize.h * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeScope();
window.addEventListener('resize', sizeScope);

// Where each voice sits vertically, and how big its bloom is. Low voices
// low and broad, the melody high and small — the shape of the arrangement
// laid out the way you would read a score.
const VOICE_STYLE = {
  kick:  { y: 0.86, r: 190, a: 0.30 },
  bass:  { y: 0.74, r: 130, a: 0.24 },
  snare: { y: 0.62, r: 90,  a: 0.20 },
  keys:  { y: 0.46, r: 105, a: 0.20 },
  lead:  { y: 0.26, r: 70,  a: 0.26 },
  hat:   { y: 0.14, r: 46,  a: 0.13 },
};

// A note is drawn for as long as it takes to fade, not for its duration:
// what is being shown is the strike, not the sustain.
const BLOOM_SECONDS = 1.5;

function drawScope() {
  if (!scopeRunning) return;
  requestAnimationFrame(drawScope);

  const pos = stream.position();
  sctx.clearRect(0, 0, scopeSize.w, scopeSize.h);
  if (!pos) return;

  // Additive light only works on a dark ground. Painted normally onto a
  // pale one it fogs the page and takes the text with it — legible in the
  // screenshot as washed-out word fields. In day mode the blooms darken
  // instead, so they read as the same light casting a tint rather than as
  // haze laid over everything.
  const night = document.documentElement.dataset.mode !== 'day';
  sctx.globalCompositeOperation = night ? 'lighter' : 'multiply';

  for (const note of pos.score) {
    const age = pos.at - note.t;
    if (age < 0) break;              // the score is sorted; nothing later has sounded
    if (age > BLOOM_SECONDS) continue;
    const style = VOICE_STYLE[note.v];
    if (!style) continue;

    // Out fast, then a long tail — the shape of a struck note.
    const life = 1 - age / BLOOM_SECONDS;
    const strength = life * life * note.g;
    // Pitched voices drift sideways with their register, so a rising line
    // moves across rather than pulsing in one place.
    const octave = note.n ? Number(note.n.slice(-1)) : 3;
    const x = scopeSize.w * (0.5 + (Number.isFinite(octave) ? (octave - 3.5) * 0.085 : 0));
    const y = scopeSize.h * style.y;
    const radius = style.r * (0.55 + life * 0.75);

    const gradient = sctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, scopeColour);
    gradient.addColorStop(1, 'transparent');
    sctx.globalAlpha = Math.min(0.5, strength * style.a * (night ? 1 : 0.34));
    sctx.fillStyle = gradient;
    sctx.beginPath();
    sctx.arc(x, y, radius, 0, Math.PI * 2);
    sctx.fill();
  }

  sctx.globalAlpha = 1;
  sctx.globalCompositeOperation = 'source-over';
}

function startScope() {
  if (scopeRunning) return;
  scopeRunning = true;
  scope.dataset.on = 'true';
  requestAnimationFrame(drawScope);
}

function stopScope() {
  scopeRunning = false;
  scope.dataset.on = 'false';
  sctx.clearRect(0, 0, scopeSize.w, scopeSize.h);
}

// --- colour and mode ---------------------------------------------------

function applyColour(palette) {
  if (!palette || palette.hue === undefined) return;
  document.documentElement.style.setProperty('--hue', String(palette.hue));
  document.documentElement.style.setProperty('--chroma', String(palette.chroma));
  // Keep the browser chrome in step with the page on mobile, where the
  // address bar sits right against it.
  // The colour transition takes a couple of seconds; pick the resolved
  // value up once it has landed rather than mid-fade.
  setTimeout(refreshScopeColour, 2600);
  refreshScopeColour();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const probe = getComputedStyle(document.body).backgroundColor;
    if (probe) meta.setAttribute('content', probe);
  }
}

// Night by default: this is made to be left running in the dark. The choice
// is remembered, and honoured if the reader has told their system already.
const MODE_KEY = '076lofi:mode';
function setMode(mode) {
  document.documentElement.dataset.mode = mode;
  try { localStorage.setItem(MODE_KEY, mode); } catch (_) { /* private window */ }
}
(function initMode() {
  let saved = null;
  try { saved = localStorage.getItem(MODE_KEY); } catch (_) { /* private window */ }
  if (saved === 'day' || saved === 'night') return setMode(saved);
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  setMode(prefersLight ? 'day' : 'night');
})();
$('mode').addEventListener('click', () => {
  setMode(document.documentElement.dataset.mode === 'day' ? 'night' : 'day');
  applyColour(stream.palette);
});

// Show the identity the words would choose before a note is played, so the
// three words are visibly doing something as they are typed.
function previewPalette() {
  const palette = stream.palette;
  if (!palette || stream.isPlaying) return;
  applyColour(palette);
  $('palette').textContent = palette.name;
  $('palette').dataset.idle = 'true';
  $('feel').textContent = palette.mode + ' · ' + Math.round(palette.bpm) + ' bpm';
}

async function start() {
  wordsAtStart = currentWords().join(' ');
  playBtn.disabled = true;
  // Writing the first bars takes a few seconds; say so with the button
  // rather than leaving it looking like nothing happened.
  playBtn.dataset.busy = 'true';
  setPlayingUI(true);
  try {
    await stream.start();
    startScope();
  } catch (err) {
    setStatus('could not start: ' + (err && err.message ? err.message : err), 'error');
    setPlayingUI(false);
  } finally {
    playBtn.disabled = false;
    playBtn.dataset.busy = 'false';
  }
}

function stop() {
  stream.stop();
  stopScope();
  setPlayingUI(false);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  $('section').textContent = '—';
  $('key').textContent = '—';
  $('progression').textContent = '—';
  $('status').textContent = 'stopped';
  previewPalette();
}

playBtn.addEventListener('click', () => (stream.isPlaying ? stop() : start()));
volume.addEventListener('input', () => stream.setVolume(Number(volume.value)));
stream.setVolume(Number(volume.value));
setPlayingUI(false);

// Bootstrapping goes last, after every declaration it touches. These two
// used to sit next to the word inputs, above the drawing code, and calling
// previewPalette() from there reached scopeColour before its `let` had run.
showReading(stream.reading);
previewPalette();
void romanLabel;
</script>
</body>
</html>
